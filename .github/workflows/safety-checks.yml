name: Safety checks

# No path filters: every main push needs its own exact-commit result.
# The second branch is for a separately approved, user-managed bootstrap only.
on:
  push:
    branches: [main, safety-check-bootstrap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    # Keep unique and stable; Vercel must require this name after approval.
    name: Consumed release safety
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact triggering commit
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read the canonical verification toolchain
        id: toolchain
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { TOOLCHAIN } from './scripts/lib/release-verification.mjs';
          appendFileSync(process.env.GITHUB_OUTPUT, `node=${TOOLCHAIN.nodeMajor}\nnpm=${TOOLCHAIN.npm}\n`);
          NODE

      - name: Set up the verification Node version
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm

      - name: Select the exact verification npm version
        id: npm
        run: npm install --global "npm@${{ steps.toolchain.outputs.npm }}" --ignore-scripts

      - name: Install locked development and optional dependencies
        id: dependencies
        run: npm ci --include=dev --include=optional

      - name: Install browsers and Ubuntu libraries
        id: browsers
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Run canonical verification without skips
        id: verify
        run: npm run verify

      - name: Retain verification and synthetic fixture evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-safety-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            generated-artifacts/release-verification/
            generated-artifacts/modal-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Require all mandatory steps and exact-commit evidence
        if: ${{ always() }}
        env:
          SAFETY_STEP_RESULTS: ${{ toJSON(steps) }}
        run: node scripts/assert-release-verification.mjs
